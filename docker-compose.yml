services:
services:
  db:
    image: postgres:16
    container_name: metering-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metering
    ports:
      - "5432:5432"
    volumes:
      - metering_data:/var/lib/postgresql/data

volumes:
  metering_data:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metering_data:
